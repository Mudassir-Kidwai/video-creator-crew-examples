<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat to Dog</title>
<script src="/_st/stage.js"></script>
<link rel="stylesheet" href="/_st/themes/bold.css">
<script type="module" src="/_st/components/index.js"></script>
<style>
  /* Two scenes, one handoff (a warped fractal front). Every move is a CSS keyframe, so the stage
     can seek to any frame. animation-delay = seconds from the scene start. */
  .scene { overflow: hidden; }
  .cat { background: radial-gradient(70% 80% at 50% 55%, #ffb45c, #e0741c 70%, #a94a0c); }
  .dog { background: radial-gradient(70% 80% at 50% 55%, #7cc4ff, #2f7fd6 70%, #17427f); }

  .pet { position: absolute; left: 50%; top: 47%; width: 62cqh; height: 62cqh; margin: -31cqh 0 0 -31cqh;
    animation: pop 0.7s var(--ease-out) 0.05s both, bob 2.4s ease-in-out 0.75s both; }
  @keyframes pop { from { opacity: 0; transform: scale(0.6) translateY(6cqh); } to { opacity: 1; transform: none; } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1.6cqh) rotate(-2deg); } }

  .lid { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 0.28s ease-in-out 1.5s both; }
  @keyframes blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.08); } }
  .ear-l, .ear-r { transform-box: fill-box; transform-origin: 50% 100%; }
  .cat .ear-l { animation: twitch 0.5s ease-in-out 1.1s both; }
  @keyframes twitch { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-9deg); } 70% { transform: rotate(4deg); } }
  .dog .ear-l { transform-origin: 80% 10%; animation: flop 0.7s ease-in-out 0.9s both; }
  .dog .ear-r { transform-origin: 20% 10%; animation: flop2 0.7s ease-in-out 0.9s both; }
  @keyframes flop { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
  @keyframes flop2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(12deg); } }
  .tongue { transform-box: fill-box; transform-origin: 50% 0%; animation: pant 0.55s ease-in-out 0.9s 3 both; }
  @keyframes pant { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.25); } }

  .label { position: absolute; left: 0; right: 0; bottom: 7cqh; text-align: center;
    font: 800 11cqh/1 var(--font-display); letter-spacing: -0.03em; color: #140b05;
    animation: rise 0.6s var(--ease-out) 0.35s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(5cqh); } to { opacity: 1; transform: none; } }
  .dot { position: absolute; top: 6cqh; left: 6cqw; font: 700 3.4cqh/1 var(--font-mono); letter-spacing: 0.08em;
    color: #140b05; background: #fff4e6; padding: 1.4cqh 2.2cqh; border-radius: 99cqh; animation: rise 0.5s var(--ease-out) 0.1s both; }
</style>
</head>
<body>
<div class="stage">

  <section class="scene cat" id="cat" data-start="0" data-dur="2.5">
    <div class="dot">01 / CAT</div>
    <svg class="pet" viewBox="0 0 400 400" aria-hidden="true">
      <g class="ear-l"><polygon points="70,150 90,30 175,95" fill="#3b2a20"/><polygon points="92,130 100,68 145,100" fill="#f4a8a0"/></g>
      <g class="ear-r"><polygon points="330,150 310,30 225,95" fill="#3b2a20"/><polygon points="308,130 300,68 255,100" fill="#f4a8a0"/></g>
      <ellipse cx="200" cy="220" rx="150" ry="140" fill="#4a3428"/>
      <ellipse cx="200" cy="255" rx="88" ry="70" fill="#f6e7d6"/>
      <g class="lid"><ellipse cx="140" cy="200" rx="24" ry="30" fill="#fff"/><ellipse cx="140" cy="204" rx="11" ry="20" fill="#111"/>
      <ellipse cx="260" cy="200" rx="24" ry="30" fill="#fff"/><ellipse cx="260" cy="204" rx="11" ry="20" fill="#111"/></g>
      <polygon points="186,240 214,240 200,258" fill="#e98a94"/>
      <path d="M200 258 V272 M200 272 Q182 292 165 278 M200 272 Q218 292 235 278" stroke="#3b2a20" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g stroke="#f6e7d6" stroke-width="4" stroke-linecap="round"><path d="M120 255 L45 240"/><path d="M120 270 L45 275"/><path d="M280 255 L355 240"/><path d="M280 270 L355 275"/></g>
    </svg>
    <div class="label">Meow.</div>
  </section>

  <section class="scene dog" id="dog" data-start="#cat" data-dur="2.5" data-transition="morph-warp 0.8">
    <div class="dot">02 / DOG</div>
    <svg class="pet" viewBox="0 0 400 400" aria-hidden="true">
      <g class="ear-l"><path d="M95 110 Q30 120 40 250 Q50 300 95 270 Q120 200 130 130 Z" fill="#6b4226"/></g>
      <g class="ear-r"><path d="M305 110 Q370 120 360 250 Q350 300 305 270 Q280 200 270 130 Z" fill="#6b4226"/></g>
      <ellipse cx="200" cy="205" rx="122" ry="135" fill="#c99a6b"/>
      <ellipse cx="200" cy="270" rx="78" ry="62" fill="#f1dcc0"/>
      <g class="lid"><circle cx="155" cy="190" r="23" fill="#fff"/><circle cx="157" cy="193" r="12" fill="#111"/>
      <circle cx="245" cy="190" r="23" fill="#fff"/><circle cx="243" cy="193" r="12" fill="#111"/></g>
      <ellipse cx="200" cy="245" rx="30" ry="22" fill="#2a1a12"/>
      <path d="M200 267 V282 M200 282 Q176 306 154 288 M200 282 Q224 306 246 288" stroke="#2a1a12" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="tongue" d="M184 300 Q200 358 216 300 Z" fill="#ef7f8f"/>
    </svg>
    <div class="label">Woof.</div>
  </section>

</div>
</body>
</html>
